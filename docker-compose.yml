version: '3.8'

services:
  backend:
    image: spark-chat-backend
    build:
      context: ./Backend
      dockerfile: dockerfile
    container_name: spark-chat-backend
    ports:
      - "8080:8080"
      - "21003:21003"
    networks:
      - spark-chat-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: spark-chat-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: spark-chat-frontend
    ports:
      - "3000:3000"
    environment:
      - SERVICE_SERVER_URL=http://spark-chat-backend:8080
      - CHAT_SERVER_URL=ws://spark-chat-backend:21003/ws
      - JWT_
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - spark-chat-network

networks:
  spark-chat-network:
    driver: bridge